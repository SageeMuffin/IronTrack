# Intégration continue : tests et compilation de la version de développement à chaque push / PR.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK de développement
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer le JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Tests unitaires (core + app)
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest

      - name: Compiler l'APK de développement
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      # Vérifie que la minification R8 de la version de production passe (APK non signé, jamais publié).
      - name: Vérifier la compilation de production (R8)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Publier l'APK de développement (artefact CI)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IronTrack-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports-tests
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7
